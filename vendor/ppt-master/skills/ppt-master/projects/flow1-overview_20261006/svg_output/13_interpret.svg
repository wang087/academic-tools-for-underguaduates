<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P13 · 解读 / INTERPRET</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">逐篇解读：用并行子代理读完每一篇</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">阶段 H</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">13 / 19</text>
  </g>

  <g id="fanout" data-pptx-bounds="0 132 1280 280">
    <text x="72" y="166" font-size="24" fill="#1B2A32">每篇一个自包含任务包，每篇一张解读卡：题录 + 摘要 + 正文（带页标记）</text>
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.5">
      <rect x="72" y="196" width="300" height="140" rx="4"/>
    </g>
    <text x="100" y="250" font-size="36" font-weight="bold" fill="#0F4C5C">单篇任务包</text>
    <text x="100" y="296" font-size="24" fill="#1B2A32">自包含，子代理不需要联网</text>
    <line x1="372" y1="266" x2="452" y2="266" stroke="#5A6B73" stroke-width="0.8" stroke-dasharray="4,4"/>
    <g fill="#FFFFFF" stroke="#5A6B73" stroke-width="1.2">
      <rect x="464" y="188" width="216" height="68" rx="4"/>
      <rect x="464" y="270" width="216" height="68" rx="4"/>
      <rect x="700" y="188" width="216" height="68" rx="4"/>
      <rect x="700" y="270" width="216" height="68" rx="4"/>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#5A6B73">
      <text x="488" y="230">AGENT 1</text>
      <text x="488" y="312">AGENT 2</text>
      <text x="724" y="230">AGENT 3</text>
      <text x="724" y="312">AGENT 4</text>
    </g>
    <line x1="916" y1="263" x2="964" y2="263" stroke="#5A6B73" stroke-width="0.8" stroke-dasharray="4,4"/>
    <g fill="#F3F6F8" stroke="#3E8E7E" stroke-width="1.5">
      <rect x="976" y="196" width="232" height="140" rx="4"/>
    </g>
    <text x="1004" y="250" font-size="36" font-weight="bold" fill="#3E8E7E">逐篇解读卡</text>
    <text x="1004" y="296" font-size="24" fill="#1B2A32">回收时做内容级校验</text>
  </g>

  <g id="tier-band" data-pptx-bounds="0 412 1280 128">
    <line x1="72" y1="432" x2="1208" y2="432" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="478" font-size="36" font-weight="bold" fill="#1B2A32">三档只差细节量，不差断言强度</text>
    <text x="72" y="520" font-size="24" fill="#5A6B73">精简 = 速览表；详细 = 逐篇卡片；完整 = 深度解读</text>
  </g>

  <g id="reading-note" data-pptx-bounds="0 540 1280 180">
    <line x1="72" y1="558" x2="1208" y2="558" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="604" font-size="24" fill="#1B2A32">截取正文时保留<tspan fill="#0F4C5C" font-weight="bold">头 60% + 尾 40%</tspan>：结论、量化数据与作者自述局限全在结尾</text>
    <text x="72" y="646" font-size="24" fill="#5A6B73">分批派发：一次性并发过高会产出「结构合法但内容是占位符」的卡，必须限制并发并校验内容</text>
    <text x="72" y="688" font-size="24" fill="#5A6B73">交付一份带时间线、逐篇要点、关键词与研究方向归类的解读报告</text>
  </g>
