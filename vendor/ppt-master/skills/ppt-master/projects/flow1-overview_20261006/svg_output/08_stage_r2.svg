<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P08 · 阶段 R① R2 / READ</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">先拿全文，再并行精读</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">分批派发</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">08 / 19</text>
  </g>

  <g id="step-rail" data-pptx-bounds="0 132 1280 200">
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.2">
      <rect x="72" y="156" width="248" height="96" rx="4"/>
      <rect x="344" y="156" width="248" height="96" rx="4"/>
      <rect x="616" y="156" width="248" height="96" rx="4"/>
      <rect x="888" y="156" width="248" height="96" rx="4"/>
    </g>
    <g font-size="24" fill="#0F4C5C" font-weight="bold">
      <text x="96" y="200">R① 组装任务包</text>
      <text x="368" y="200">R①.5 取全文</text>
      <text x="640" y="200">R2 并行精读</text>
      <text x="912" y="200">R② 汇总概貌</text>
    </g>
    <g font-size="24" fill="#1B2A32" font-family="Consolas, monospace">
      <text x="96" y="236">每篇一个包</text>
      <text x="368" y="236">分层取证</text>
      <text x="640" y="236">每篇一个子代理</text>
      <text x="912" y="236">机械合并</text>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#5A6B73">
      <text x="330" y="212">→</text>
      <text x="602" y="212">→</text>
      <text x="874" y="212">→</text>
    </g>
  </g>

  <g id="evidence-ladder" data-pptx-bounds="0 344 1280 228">
    <line x1="72" y1="364" x2="1208" y2="364" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="398" font-size="24" fill="#1B2A32">证据层级决定结论强度：读不到全文就如实降级标注</text>
    <g fill="none" stroke="#5A6B73" stroke-width="1.2">
      <rect x="72" y="410" width="300" height="36" rx="3"/>
      <rect x="72" y="450" width="240" height="36" rx="3"/>
      <rect x="72" y="490" width="180" height="36" rx="3"/>
      <rect x="72" y="530" width="120" height="36" rx="3"/>
    </g>
    <g font-size="24" fill="#1B2A32">
      <text x="96" y="435">全文</text>
      <text x="96" y="475">详细摘要</text>
      <text x="96" y="515">摘要</text>
      <text x="96" y="555">仅有题录</text>
    </g>
    <g font-size="24" fill="#5A6B73">
      <text x="420" y="435">结论强度最高，任务包直接带全文</text>
      <text x="420" y="475">通常含目的 / 方法 / 结果，可作依据</text>
      <text x="420" y="515">只能作概览，不下强结论</text>
      <text x="420" y="555">只能依据题录，报告里如实标注</text>
    </g>
  </g>

  <g id="method-note" data-pptx-bounds="0 584 1280 136">
    <line x1="72" y1="596" x2="1208" y2="596" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="636" font-size="24" fill="#1B2A32">分批派发子代理：卡不全时如实说明「基于部分文献」，检出占位符的卡<tspan fill="#B33A2B" font-weight="bold">拒收重派</tspan></text>
    <text x="72" y="678" font-size="24" fill="#5A6B73">汇总只做机械合并：共识标出、争议原样并列、缺卡如实列出，不替用户判定谁对</text>
    <text x="1010" y="678" font-family="Consolas, monospace" font-size="22" fill="#F09A00">不假装齐全</text>
  </g>
