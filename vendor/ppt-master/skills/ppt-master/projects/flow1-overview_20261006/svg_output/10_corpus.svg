<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P10 · 清单 / CORPUS</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">成果清单：先确认哪些真的是他写的</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">A–D</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">10 / 19</text>
  </g>

  <g id="source-stack" data-pptx-bounds="0 132 1280 356">
    <text x="72" y="166" font-size="24" fill="#1B2A32">三个来源互相补齐，任何一个单独用都会漏人或混入他人</text>
    <g fill="#FFFFFF" stroke="#5A6B73" stroke-width="1.2">
      <rect x="72" y="192" width="500" height="88" rx="4"/>
      <rect x="72" y="292" width="500" height="88" rx="4"/>
      <rect x="72" y="392" width="500" height="88" rx="4"/>
    </g>
    <g font-size="24" fill="#1B2A32" font-weight="bold">
      <text x="100" y="230">记录库（作者标识）</text>
      <text x="100" y="330">作者主页自述清单</text>
      <text x="100" y="430">开放学术图谱</text>
    </g>
    <g font-size="24" fill="#5A6B73">
      <text x="100" y="262">可能有重复条目，也可能完全没有同步</text>
      <text x="100" y="362">作者自己认可的成果集，权威性最高</text>
      <text x="100" y="462">作者聚合会过度合并，须消歧</text>
    </g>
    <line x1="572" y1="336" x2="700" y2="336" stroke="#5A6B73" stroke-width="0.8" stroke-dasharray="4,4"/>
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.5">
      <rect x="712" y="256" width="496" height="160" rx="4"/>
    </g>
    <text x="740" y="304" font-size="36" font-weight="bold" fill="#0F4C5C">去重后的权威成果总表</text>
    <text x="740" y="350" font-size="24" fill="#1B2A32">逐条核实期刊 / 年 / 卷 / 期 / 页</text>
    <text x="740" y="388" font-size="24" fill="#1B2A32">回填结构化作者全名，供规范著录</text>
  </g>

  <g id="verify-note" data-pptx-bounds="0 500 1280 220">
    <line x1="72" y1="516" x2="1208" y2="516" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="560" font-size="36" font-weight="bold" fill="#1B2A32">为什么要交叉确认</text>
    <text x="72" y="610" font-size="24" fill="#5A6B73">单一来源各有缺口：记录库重复或缺失，聚合库过度合并</text>
    <text x="72" y="650" font-size="24" fill="#5A6B73">某些作者在记录库里没有同步成果，此时以主页自述清单为准</text>
    <text x="72" y="694" font-family="Consolas, monospace" font-size="20" fill="#F09A00">下一张：怎么把同名他人的论文剔出去</text>
  </g>
</svg>
