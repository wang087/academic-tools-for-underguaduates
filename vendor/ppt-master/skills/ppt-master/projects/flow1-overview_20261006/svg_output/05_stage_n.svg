<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P05 · 阶段 N / SCOPE</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">阶段 N：先把方向定下来</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">无交互</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">05 / 19</text>
  </g>

  <g id="step-band" data-pptx-bounds="0 132 1280 320">
    <text x="72" y="166" font-size="24" fill="#1B2A32">这一步解决什么：把口语意向转成结构化方向 + 关键词群</text>
    <g fill="none" stroke="#0F4C5C" stroke-width="1.5">
      <rect x="72" y="196" width="248" height="200" rx="4"/>
      <rect x="344" y="196" width="248" height="200" rx="4"/>
      <rect x="616" y="196" width="248" height="200" rx="4"/>
      <rect x="888" y="196" width="248" height="200" rx="4"/>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#F09A00">
      <text x="96" y="234">STEP 1</text>
      <text x="368" y="234">STEP 2</text>
      <text x="640" y="234">STEP 3</text>
      <text x="912" y="234">STEP 4</text>
    </g>
    <g font-size="36" font-weight="bold" fill="#0F4C5C">
      <text x="96" y="292">解析输入</text>
      <text x="368" y="292">拆主题词</text>
      <text x="640" y="292">查方法词</text>
      <text x="912" y="292">落盘计划</text>
    </g>
    <g font-size="24" fill="#1B2A32">
      <text x="96" y="338">学校 / 学部</text>
      <text x="96" y="374">主题 / 层次</text>
      <text x="368" y="338">用户给什么</text>
      <text x="368" y="374">用什么 + 同义扩展</text>
      <text x="640" y="338">在方法总表里找</text>
      <text x="640" y="374">会用到哪些方法</text>
      <text x="912" y="338">方向 + 中英词群</text>
      <text x="912" y="374">+ 检索式草稿</text>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#5A6B73">
      <text x="147" y="447">→</text>
      <text x="419" y="447">→</text>
      <text x="691" y="447">→</text>
    </g>
  </g>

  <g id="key-insight" data-pptx-bounds="0 464 1280 128">
    <line x1="72" y1="486" x2="1208" y2="486" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="530" font-size="36" font-weight="bold" fill="#1B2A32">关键认知：总表是「方法」分类，不是「主题」索引</text>
    <text x="72" y="574" font-size="24" fill="#B33A2B">拿「阿尔茨海默」「早期诊断」「生物标志物」去搜，一个都命中不了</text>
  </g>

  <g id="policy-note" data-pptx-bounds="0 604 1280 116">
    <line x1="72" y1="604" x2="1208" y2="604" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="652" font-size="24" fill="#5A6B73">两类词分开取：主题词<tspan fill="#0F4C5C" font-weight="bold">从用户输入来</tspan>，方法词<tspan fill="#0F4C5C" font-weight="bold">去总表查</tspan><tspan x="72" dy="36">产出中英双语检索词组，直接喂给阶段 R</tspan></text>
  </g>
</svg>
