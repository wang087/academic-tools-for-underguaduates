<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P07 · 阶段 R / ROUTING</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">阶段 R：按方向选库，综述优先</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">6–12 篇</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">07 / 19</text>
  </g>

  <g id="routing-table" data-pptx-bounds="0 132 1280 312">
    <text x="72" y="166" font-size="24" fill="#1B2A32">库要按方向选：同一批关键词在不同库里命中完全不同的文献生态</text>
    <g font-family="Consolas, monospace" font-size="22" fill="#5A6B73">
      <text x="96" y="216">研究方向</text>
      <text x="440" y="216">主力库</text>
      <text x="720" y="216">补充库</text>
      <text x="960" y="216">明确不跑</text>
    </g>
    <line x1="72" y1="228" x2="1208" y2="228" stroke="#D6DEE3" stroke-width="1"/>
    <g font-size="24" fill="#1B2A32">
      <text x="96" y="276">机器学习与深度学习</text>
      <text x="96" y="330">免疫与感染</text>
      <text x="96" y="384">生物信息与基因组学</text>
    </g>
    <g font-size="24" fill="#0F4C5C" font-weight="bold">
      <text x="440" y="276">arXiv</text>
      <text x="440" y="330">Europe PMC</text>
      <text x="440" y="384">Europe PMC + arXiv</text>
    </g>
    <g font-size="24" fill="#5A6B73">
      <text x="720" y="276">OpenAlex</text>
      <text x="720" y="330">medRxiv</text>
      <text x="720" y="384">bioRxiv</text>
    </g>
    <g font-size="24" fill="#B33A2B">
      <text x="960" y="276">Europe PMC</text>
      <text x="960" y="330">arXiv</text>
      <text x="960" y="384">——（两侧都要）</text>
    </g>
    <line x1="72" y1="300" x2="1208" y2="300" stroke="#F3F6F8" stroke-width="1"/>
    <line x1="72" y1="354" x2="1208" y2="354" stroke="#F3F6F8" stroke-width="1"/>
    <line x1="72" y1="408" x2="1208" y2="408" stroke="#D6DEE3" stroke-width="1"/>
  </g>

  <g id="lesson-band" data-pptx-bounds="0 452 1280 128">
    <line x1="72" y1="474" x2="1208" y2="474" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="520" font-size="36" font-weight="bold" fill="#1B2A32">实测教训：三线全跑，只有一条真正产出文献</text>
    <text x="72" y="562" font-size="24" fill="#5A6B73">拿免疫学去查 arXiv，返回的 24 条里绝大多数是计算机领域的同名词</text>
  </g>

  <g id="criteria-band" data-pptx-bounds="0 592 1280 128">
    <line x1="72" y1="608" x2="1208" y2="608" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="650" font-size="36" font-weight="bold" fill="#0F4C5C">筛选标准</text>
    <text x="300" y="650" font-size="24" fill="#1B2A32">类型优先 → 影响力 → 时效（近 3–5 年）→ 开放获取优先</text>
    <text x="72" y="690" font-size="24" fill="#5A6B73">数量 6–12 篇为宜；结果被上限截断时如实标注为<tspan fill="#B33A2B" font-weight="bold">部分结果</tspan></text>
  </g>
</svg>
