<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P06 · 阶段 S / MENTORS</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">阶段 S：把导师名单摊开</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">必须停下</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">06 / 19</text>
  </g>

  <g id="mentor-rows" data-pptx-bounds="0 132 1280 364">
    <text x="72" y="166" font-size="24" fill="#1B2A32">抓学部官网师资页 → 按方向归类 → 呈现给用户选择</text>
    <g fill="#FFFFFF" stroke="#D6DEE3" stroke-width="1.2">
      <rect x="72" y="182" width="1136" height="66" rx="4"/>
      <rect x="72" y="256" width="1136" height="66" rx="4"/>
      <rect x="72" y="330" width="1136" height="66" rx="4"/>
    </g>
    <g font-size="36" font-weight="bold" fill="#1B2A32">
      <text x="100" y="228">免疫与感染</text>
      <text x="100" y="302">神经与脑科学</text>
      <text x="100" y="376">生物信息与计算</text>
    </g>
    <g font-size="24" fill="#5A6B73">
      <text x="440" y="228">余跃 · 倪芳 · 吴清发 · 周荣斌</text>
      <text x="440" y="302">刘丹 · 刘北明 · 周逸峰 · 唐爱辉</text>
      <text x="440" y="376">刘东 · 刘海燕 · 唐爱辉 · 周丛照</text>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#F09A00">
      <text x="1080" y="228">40 人</text>
      <text x="1080" y="302">22 人</text>
      <text x="1080" y="376">22 人</text>
    </g>
    <text x="72" y="428" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">以上为示例节选；报告里保留每位老师的主页原文与链接，可自行核对</text>
    <line x1="72" y1="480" x2="1208" y2="480" stroke="#D6DEE3" stroke-width="1"/>
  </g>

  <g id="showcase-band" data-pptx-bounds="0 496 1280 102">
    <text x="72" y="540" font-size="36" font-weight="bold" fill="#0F4C5C">为什么只认学部官网</text>
    <text x="72" y="580" font-size="24" fill="#1B2A32">教师主页系统覆盖不全，且大量页面没有「研究方向」栏位</text>
  </g>

  <g id="honesty-note" data-pptx-bounds="0 604 1280 116">
    <line x1="72" y1="616" x2="1208" y2="616" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="660" font-size="24" fill="#5A6B73">归类是关键词粗分类、不是权威学科划分，一位老师可出现在多个方向下<tspan x="72" dy="34">页面确无该栏位就如实标注，不用印象补全</tspan></text>
    <text x="960" y="660" font-family="Consolas, monospace" font-size="22" fill="#F09A00">必须等用户选择</text>
  </g>
</svg>
