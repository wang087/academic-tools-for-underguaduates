    <text x="72" y="130" font-size="56" font-weight="bold" fill="#0F4C5C">一句话总结</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">收束</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">19 / 19</text>
  </g>

  <g id="spine" data-pptx-bounds="0 166 1280 254">
    <line x1="100" y1="300" x2="1180" y2="300" stroke="#0F4C5C" stroke-width="1.5"/>
    <circle cx="200" cy="300" r="9" fill="#FFFFFF" stroke="#0F4C5C" stroke-width="2"/>
    <circle cx="640" cy="300" r="9" fill="#F09A00"/>
    <circle cx="1080" cy="300" r="9" fill="#FFFFFF" stroke="#3E8E7E" stroke-width="2"/>
    <g font-size="24" fill="#5A6B73">
      <text x="150" y="352">一句话意向</text>
      <text x="596" y="352" fill="#F09A00">可核对的证据</text>
      <text x="1030" y="352">可交付的材料</text>
