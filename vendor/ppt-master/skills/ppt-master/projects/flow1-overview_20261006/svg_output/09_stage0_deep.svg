      <text x="280" y="270">定位与抓取</text>
      <text x="464" y="270">核实与消歧</text>
      <text x="648" y="270">获取与转化</text>
      <text x="832" y="270">成稿</text>
      <text x="1016" y="270">图谱与交付</text>
