    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P09 · 原有链路 / AUTHOR DEEP DIVE</text>
    <text x="72" y="136" font-size="56" font-weight="bold" fill="#0F4C5C">接上原有链路：从一句话到一位作者的成果</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">按需接入</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">09 / 19</text>
  </g>

  <g id="stage-flow" data-pptx-bounds="0 166 1280 340">
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.2">
      <rect x="72" y="192" width="168" height="96" rx="4"/>
      <rect x="256" y="192" width="168" height="96" rx="4"/>
      <rect x="440" y="192" width="168" height="96" rx="4"/>
      <rect x="624" y="192" width="168" height="96" rx="4"/>
      <rect x="808" y="192" width="168" height="96" rx="4"/>
      <rect x="992" y="192" width="168" height="96" rx="4"/>
    </g>
    <g font-family="Consolas, monospace" font-size="22" fill="#F09A00">
      <text x="96" y="228">0</text>
      <text x="280" y="228">A–C</text>
      <text x="464" y="228">D–D2</text>
      <text x="648" y="228">E–F</text>
      <text x="832" y="228">G–H2</text>
      <text x="1016" y="228">K–P–I</text>
    </g>
    <g font-size="24" fill="#1B2A32" font-weight="bold">
