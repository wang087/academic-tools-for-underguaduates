<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P12 · 获取 / ACQUIRE</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">全文获取与中译：一条路径，两种兜底</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">分层策略</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">12 / 19</text>
  </g>

  <g id="boundary-band" data-pptx-bounds="0 132 1280 118">
    <text x="72" y="176" font-size="36" font-weight="bold" fill="#1B2A32">判定分界只有一句话：<tspan fill="#0F4C5C">这次请求要不要拿「论文正文」</tspan></text>
    <text x="72" y="222" font-size="24" fill="#5A6B73">要正文 → 一律走真实浏览器；不要正文（摘要 / 题录 / 白名单开源库）→ 才直连</text>
  </g>

  <g id="layer-table" data-pptx-bounds="0 262 1280 250">
    <line x1="72" y1="286" x2="1208" y2="286" stroke="#D6DEE3" stroke-width="1"/>
    <g font-size="24" fill="#1B2A32">
      <text x="72" y="334">元数据 · 摘要 · 综述题录 · 白名单开源库</text>
      <text x="72" y="392">原文全文（PDF / HTML 正文，含开放获取）</text>
      <text x="72" y="450">第一层全部未命中</text>
    </g>
    <g font-size="24" font-weight="bold">
      <text x="960" y="334" fill="#2F7D4F">允许直连</text>
      <text x="960" y="392" fill="#B33A2B">禁止直连，一律走浏览器</text>
      <text x="960" y="450" fill="#F09A00">转浏览器路径</text>
    </g>
    <line x1="72" y1="364" x2="1208" y2="364" stroke="#F3F6F8" stroke-width="1"/>
    <line x1="72" y1="422" x2="1208" y2="422" stroke="#F3F6F8" stroke-width="1"/>
    <line x1="72" y1="474" x2="1208" y2="474" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="504" font-size="24" fill="#5A6B73">为什么：直连正文同样被站点计数、同样触发风控，失败时也无法纳入流程的判定与日志</text>
  </g>

  <g id="fallback-band" data-pptx-bounds="0 524 1280 196">
    <line x1="72" y1="546" x2="1208" y2="546" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="592" font-size="36" font-weight="bold" fill="#0F4C5C">浏览器路径的两级兜底</text>
    <text x="72" y="636" font-size="24" fill="#1B2A32">先取出版社落地页；遇到人机验证时改用受风控更弱的开放副本来源</text>
    <text x="72" y="678" font-size="24" fill="#1B2A32">仍不可得 → 转人工过一次验证，放行凭据留在该浏览器配置里复用</text>
    <text x="960" y="678" font-family="Consolas, monospace" font-size="22" fill="#F09A00">不绕过付费墙</text>
  </g>
</svg>
