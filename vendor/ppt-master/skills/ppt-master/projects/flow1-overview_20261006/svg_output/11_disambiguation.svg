<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P11 · 验证 / DISAMBIGUATION</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">最容易出错的一步：同名消歧</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">不可省</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">11 / 19</text>
  </g>

  <g id="criteria-chain" data-pptx-bounds="0 132 1280 348">
    <text x="72" y="166" font-size="24" fill="#1B2A32">四重判据按优先级判定：先看作者本人是否认领，再看姓名与单位</text>
    <g fill="#FFFFFF" stroke="#0F4C5C" stroke-width="1.5">
      <rect x="72" y="192" width="1136" height="64" rx="4"/>
    </g>
    <text x="100" y="234" font-size="24" fill="#0F4C5C" font-weight="bold">判据 ⓪ 成果出处在本人记录里 → 直接确认（作者本人认领，强于任何单位指纹）</text>
    <g fill="#FFFFFF" stroke="#5A6B73" stroke-width="1.2">
      <rect x="72" y="272" width="1136" height="60" rx="4"/>
      <rect x="72" y="348" width="1136" height="60" rx="4"/>
    </g>
    <text x="100" y="312" font-size="24" fill="#1B2A32">判据 ① 姓名精确匹配：记录有作者名单但无精确匹配 → 可排除</text>
    <text x="100" y="388" font-size="24" fill="#1B2A32">判据 ② 署名单位指纹：命中 → 确认；不命中 → 可排除</text>
    <line x1="72" y1="436" x2="1208" y2="436" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="472" font-size="24" fill="#B33A2B">判据 — 数据缺失（署名块没有单位字段）→ 不作否定证据，一律保留并列待核</text>
  </g>

  <g id="outcome-band" data-pptx-bounds="0 492 1280 228">
    <line x1="72" y1="512" x2="1208" y2="512" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="556" font-size="36" font-weight="bold" fill="#1B2A32">只排除肯定性判定</text>
    <text x="72" y="606" font-size="24" fill="#5A6B73">漏收真论文的代价，远大于多留一篇</text>
    <text x="72" y="648" font-size="24" fill="#5A6B73">为什么必须有判据⓪：题录存缴里只有少数出版社带逐作者单位</text>
    <text x="72" y="688" font-size="24" fill="#5A6B73">消歧结果同时接入下载与著录两侧，不用手工过滤</text>
    <text x="1000" y="606" font-family="Consolas, monospace" font-size="22" fill="#F09A00">不可逆</text>
  </g>
</svg>
