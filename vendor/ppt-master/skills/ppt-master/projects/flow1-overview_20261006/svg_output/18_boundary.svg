<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P18 · 边界 / BOUNDARY</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">这套流程的边界</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">不做承诺</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">18 / 19</text>
  </g>

  <g id="scope-grid" data-pptx-bounds="0 132 1280 348">
    <line x1="636" y1="164" x2="636" y2="452" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="200" font-size="36" font-weight="bold" fill="#2F7D4F">适用</text>
    <text x="688" y="200" font-size="36" font-weight="bold" fill="#B33A2B">不适用</text>
    <g font-size="24" fill="#1B2A32">
      <text x="72" y="252">本科生进实验室选导师</text>
      <text x="72" y="298">大学生研究计划（大创）选题</text>
      <text x="72" y="344">课程综述类文献查找与写作</text>
      <text x="72" y="390">锁定某位作者后的成果分析</text>
      <text x="688" y="252">把摘要级结论当成全文结论</text>
      <text x="688" y="298">把关键词粗分类当权威学科划分</text>
      <text x="688" y="344">用自动化手段绕过人机验证</text>
      <text x="688" y="390">把被上限截断的结果说成完整结果</text>
    </g>
    <line x1="72" y1="432" x2="1208" y2="432" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="470" font-size="24" fill="#5A6B73">它面向没有科研经验的本科生：解释术语、先给为什么，再给怎么做</text>
  </g>

  <g id="precondition" data-pptx-bounds="0 496 1280 224">
    <line x1="72" y1="520" x2="1208" y2="520" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="564" font-size="36" font-weight="bold" fill="#1B2A32">前置条件</text>
    <text x="72" y="612" font-size="24" fill="#5A6B73">Windows + Microsoft Edge；Python 通过 uv 运行，不需要预装依赖</text>
    <text x="72" y="652" font-size="24" fill="#5A6B73">全文获取需要真实浏览器实例；机构订阅内容交由人工或机构渠道</text>
    <text x="72" y="694" font-family="Consolas, monospace" font-size="20" fill="#F09A00">先让本科生看得懂，再谈自动化</text>
  </g>
