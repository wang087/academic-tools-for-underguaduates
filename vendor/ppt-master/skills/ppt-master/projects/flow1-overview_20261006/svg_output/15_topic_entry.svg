<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P15 · 选题 / NEXT</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">选题切入点：从「读完了」到「我做什么」</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">闭环</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">15 / 19</text>
  </g>

  <g id="funnel" data-pptx-bounds="0 132 1280 348">
    <text x="72" y="166" font-size="24" fill="#1B2A32">最适合大创的题目，往往就写在综述的「仍未解决」那一节里</text>
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.2">
      <rect x="72" y="200" width="1136" height="60" rx="4"/>
      <rect x="152" y="272" width="976" height="60" rx="4"/>
      <rect x="232" y="344" width="816" height="60" rx="4"/>
    </g>
    <g font-size="24" fill="#1B2A32">
      <text x="100" y="238" font-weight="bold">读到的结论：共识是什么、争议在哪</text>
      <text x="180" y="310" font-weight="bold">仍未解决 / 有争议的问题</text>
      <text x="260" y="382" font-weight="bold">可做的选题切入点</text>
    </g>
    <g font-size="24" fill="#5A6B73">
      <text x="700" y="238">来自 6–12 篇综述的汇总</text>
      <text x="700" y="310">推荐阅读顺序：入门 → 奠基 → 争议 → 方法</text>
      <text x="700" y="382">小到本科生一个学期做得完</text>
    </g>
    <line x1="72" y1="432" x2="1208" y2="432" stroke="#F09A00" stroke-width="3"/>
    <text x="72" y="470" font-size="24" fill="#5A6B73">闭环：方向与导师名单（阶段 N / S）+ 该方向的共识与争议（阶段 R2）对齐，就能写出一封说得清来意的邮件</text>
  </g>

  <g id="next-note" data-pptx-bounds="0 496 1280 224">
    <line x1="72" y1="516" x2="1208" y2="516" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="560" font-size="36" font-weight="bold" fill="#0F4C5C">本科生不需要自己想出全新问题</text>
    <text x="72" y="610" font-size="24" fill="#5A6B73">先在一个已有共识与争议的框架里，选一个做得完的小问题</text>
    <text x="72" y="652" font-size="24" fill="#5A6B73">交付形态：领域概貌里的「可能的选题切入点」一节 + 推荐阅读顺序</text>
    <text x="72" y="694" font-family="Consolas, monospace" font-size="20" fill="#F09A00">这一段是本科入门链路的终点，也是原有链路的起点</text>
  </g>
</svg>
