<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#D6DEE3" stroke-width="1" stroke-opacity="0.4">
    <line x1="212" y1="0" x2="212" y2="720"/>
    <line x1="572" y1="0" x2="572" y2="720"/>
    <line x1="932" y1="0" x2="932" y2="720"/>
  </g>

  <g id="page-furniture" data-pptx-role="header" data-pptx-bounds="0 0 1280 126">
    <line x1="0" y1="112" x2="1280" y2="112" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="66" font-family="Consolas, monospace" font-size="22" fill="#5A6B73">P17 · 交付 / DELIVERABLES</text>
    <text x="72" y="102" font-size="56" font-weight="bold" fill="#0F4C5C">拿到手的是什么</text>
    <text x="1020" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">清单</text>
    <text x="1150" y="66" font-family="Consolas, monospace" font-size="20" fill="#5A6B73">17 / 19</text>
  </g>

  <g id="deliverables" data-pptx-bounds="0 132 1280 372">
    <g fill="#F3F6F8" stroke="#0F4C5C" stroke-width="1.5">
      <rect x="72" y="164" width="548" height="316" rx="4"/>
    </g>
    <g fill="#FFFFFF" stroke="#5A6B73" stroke-width="1.2">
      <rect x="660" y="164" width="548" height="316" rx="4"/>
    </g>
    <text x="100" y="212" font-size="36" font-weight="bold" fill="#0F4C5C">入门交付（到 R2 为止）</text>
    <text x="688" y="212" font-size="36" font-weight="bold" fill="#1B2A32">深挖交付（接原有链路）</text>
    <g font-size="24" fill="#1B2A32">
      <text x="100" y="262">方向与关键词计划：中英双语检索词</text>
      <text x="100" y="306">分方向的导师名单：带主页链接</text>
      <text x="100" y="350">6–12 篇优质综述清单：含开放获取链接</text>
      <text x="100" y="394">领域概貌：概念 + 共识 + 争议</text>
      <text x="100" y="438">　　+ 阅读顺序 + 可能切入点</text>
      <text x="688" y="262">规范著录的论文列表：含 DOI 与原文链接</text>
      <text x="688" y="306">全文获取清单：逐篇状态与未获取原因</text>
      <text x="688" y="350">逐篇论文解读 / 研究方向综述</text>
      <text x="688" y="394">知识图谱三张：总览 / 词云 / 方向聚类</text>
      <text x="688" y="438">可选：一份汇报 PPT</text>
    </g>
  </g>

  <g id="usage-note" data-pptx-bounds="0 516 1280 204">
    <line x1="72" y1="540" x2="1208" y2="540" stroke="#D6DEE3" stroke-width="1"/>
    <text x="72" y="584" font-size="24" fill="#1B2A32">用法：名单直接用于<tspan fill="#0F4C5C" font-weight="bold">联系导师的邮件</tspan>；综述清单与领域概貌直接用于<tspan fill="#0F4C5C" font-weight="bold">开题报告或课程论文</tspan></text>
    <text x="72" y="626" font-size="24" fill="#5A6B73">每份产物都能溯到来源：DOI、主页链接、证据层级、未获取原因</text>
    <text x="72" y="672" font-family="Consolas, monospace" font-size="20" fill="#F09A00">交付时同时说明覆盖度：哪些拿到全文、哪些只有摘要、为什么</text>
  </g>
</svg>
